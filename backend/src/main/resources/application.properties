# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.thread-name-prefix=stockpulse-

# Commerce Configuration
commerce.strategy=rule
commerce.demand-spike-multiplier=3.0
commerce.max-price-multiplier=2.0

# LLM Configuration
llm.provider=${LLM_PROVIDER:gemini}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-1.5-flash}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}
<!DOCTYPE html>
<html>
<head>
    <title>Proxy Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Proxy Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function testEndpoint(endpoint, name) {
            try {
                results.innerHTML += `<p>Testing ${name}...</p>`;
                const response = await fetch(endpoint);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                results.innerHTML += `<p class="success">✓ ${name}: Success (${Array.isArray(data) ? data.length : 'object'} items)</p>`;
                results.innerHTML += `<details><summary>View data</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`;
            } catch (error) {
                results.innerHTML += `<p class="error">✗ ${name}: ${error.message}</p>`;
                console.error(`${name} error:`, error);
            }
        }
        
        async function runTests() {
            await testEndpoint('/products', 'Products API');
            await testEndpoint('/pricing-suggestions', 'Pricing Suggestions API');
            await testEndpoint('/reorder-suggestions', 'Reorder Suggestions API');
        }
        
        runTests();
    </script>
</body>
</html>
